; Limites de formulário e upload para o painel admin.
; O formulário de edição de passeios pode gerar MUITOS campos
; (galeria, pacotes de composição, pacotes x categorias, FAQs, etc.).
; O padrão do PHP (max_input_vars=1000) corta os campos excedentes
; silenciosamente, fazendo o upload de imagens falhar em passeios "cheios".
max_input_vars = 5000
post_max_size = 64M
upload_max_filesize = 32M
max_file_uploads = 50
max_input_time = 120
